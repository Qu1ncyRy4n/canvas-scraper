[project]
name = "canvas-scrape"
version = "0.4.0"
description = "Mirror Canvas courses to Markdown; turn PDFs, slides and YouTube links into text"
requires-python = ">=3.12"
dependencies = ["canvasapi", "markdownify", "pptx2md", "pymupdf4llm", "yt-dlp"]

[project.scripts]
canvas-scrape = "canvas_scrape:main"
canvas-process = "canvas_scrape:process_main"
canvas-host = "canvas_scrape.host:host_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
